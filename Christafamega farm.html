<style>
/* Layout: one working column (max 960px) with a fixed bottom tab bar and a floating "Add record" button.
   Palette: adire indigo as the accent on a green-grey ground; indigo = money in, ochre = money out. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface-2:#E6EAE1; --ink:#17211B; --muted:#56655B; --line:#D3DACF;
  --accent:#2B3A9E; --accent-ink:#FFFFFF; --accent-soft:#E2E6F8;
  --good:#1D7444; --good-soft:#DCEFE3; --warn:#8F5600; --warn-soft:#FAE9C8; --bad:#B3261E; --bad-soft:#F8DDDA;
  --inc:#2B3A9E; --exp:#D08A25;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --nav-h:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --surface:#17201A; --surface-2:#202B24; --ink:#E7EEE8; --muted:#9DAEA2; --line:#2C3830;
    --accent:#97A3FF; --accent-ink:#0D1233; --accent-soft:#232A52;
    --good:#6AD594; --good-soft:#173826; --warn:#F0B654; --warn-soft:#3A2C10; --bad:#FF8F86; --bad-soft:#3E1B18;
    --inc:#97A3FF; --exp:#E8A850; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#17201A; --surface-2:#202B24; --ink:#E7EEE8; --muted:#9DAEA2; --line:#2C3830;
  --accent:#97A3FF; --accent-ink:#0D1233; --accent-soft:#232A52;
  --good:#6AD594; --good-soft:#173826; --warn:#F0B654; --warn-soft:#3A2C10; --bad:#FF8F86; --bad-soft:#3E1B18;
  --inc:#97A3FF; --exp:#E8A850; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;
  padding-block:16px calc(var(--nav-h) + 96px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;margin-top:4px}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px}
.banner strong{color:var(--warn)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface-2);border-radius:10px;padding:12px 14px;min-width:0}
.tile .k,.result .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{min-width:0}
.r-t{font-weight:600}
.r-s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.panel.pad{padding:16px}

.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-width:0}
.gcard:hover{border-color:var(--accent)}
.g-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.g-name{font-family:var(--f-display);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.g-meta{font-size:13px;color:var(--muted)}
.g-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.g-stats b{color:var(--ink);font-weight:700}
.g-stats .pos b{color:var(--good)} .g-stats .neg b{color:var(--bad)}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px}
.kv .k{font-size:12px;color:var(--muted);font-weight:600}
.kv .v{font-weight:700;font-size:17px}

.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec-t{font-weight:600}
.rec-s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rec-amt{text-align:right;font-weight:700;white-space:nowrap}
.rec-amt.in{color:var(--good)} .rec-amt.out{color:var(--ink)}
.rec-act{text-align:right}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.x.on{color:var(--bad);font-weight:700}

.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select{flex:1 1 150px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;width:100%;min-height:44px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.chart{width:100%;max-width:640px;height:auto;display:block}
.ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.gl{stroke:var(--line);stroke-width:1}
.b-inc{fill:var(--inc)} .b-exp{fill:var(--exp)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);list-style:none;margin:0;padding:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.bar-track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--exp);border-radius:99px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;padding-left:0}
tr:last-child td{border-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.result{background:var(--accent-soft);border-radius:12px;padding:16px}
.result .big{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.1;margin:4px 0;overflow-wrap:anywhere}
.result .s{color:var(--muted);font-size:14px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.seg-a{background:var(--accent)} .seg-b{background:var(--exp)} .seg-c{background:var(--muted)}
.heat td,.heat th{text-align:center}
.heat td.p{background:var(--good-soft);color:var(--good);font-weight:600}
.heat td.n{background:var(--bad-soft);color:var(--bad);font-weight:600}
.heat th:first-child,.heat td:first-child{text-align:left}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:42ch;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;width:100%;max-width:960px}
.tab{flex:1;min-width:0;height:var(--nav-h);background:none;border:0;border-top:3px solid transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;padding:0 2px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);
  box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:99px;padding:12px 20px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,16,12,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center;padding:16px}.sheet{border-radius:16px;padding:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}
</style>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MS=86400000;
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return iso(new Date())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var daysBetween=function(a,b){return Math.round((parse(b)-parse(a))/MS)};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var daysAgo=function(n){return addDays(today(),-n)};
var num=function(n){return Math.round(n).toLocaleString('en-NG')};
var naira=function(n){return (n<0?'−':'')+'₦'+Math.abs(Math.round(n)).toLocaleString('en-NG')};
var nShort=function(n){var a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e6)return s+'₦'+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(a>=1e3)return s+'₦'+Math.round(a/1e3)+'k';
  return s+'₦'+Math.round(a)};
var fmtDate=function(s){return parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
var fmtDateY=function(s){return parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
var rid=function(p){return p+Math.random().toString(36).slice(2,9)};
var ageText=function(d){if(d<70)return d+' day'+(d===1?'':'s')+' old';if(d<730)return Math.round(d/30.4)+' months old';return (d/365).toFixed(1).replace(/\.0$/,'')+' years old'};

/* ---------- species, record types, planner presets ---------- */
var SP={
  broiler:{label:'Broilers',unit:'birds',age:1,market:49,mort:5,sched:[
    {k:'nd1',t:'Newcastle vaccine (LaSota)',d:7},{k:'ibd1',t:'Gumboro (IBD) vaccine',d:14},
    {k:'ibd2',t:'Gumboro booster',d:21},{k:'nd2',t:'Newcastle booster (LaSota)',d:28}]},

    {k:'ndr',t:'Newcastle booster',d:168,every:84}]},
  catfish:{label:'Catfish',unit:'fish',age:21,market:150,mort:15,sched:[
    {k:'sort',t:'Sort by size and weigh a sample',d:30,every:30}]},
  goat:{label:'Goats',unit:'goats',age:150,market:0,mort:5,extra:['birth'],sched:[
    {k:'ppr',t:'PPR vaccine',d:90,every:365,catch:true},{k:'dew',t:'Deworming',d:120,every:90,catch:true}]},

};
var EXP_CATS=['Labour','Housing & equipment','Water & power','Transport','Other costs'];
var INC_CATS=['Manure','Other income'];
var RT={
  feed:{label:'Feed',f:['kg','amount'],kg:'Feed (kg)',amount:'Cost (₦)'},

  mortality:{label:'Deaths',f:['qty','note'],qty:'Number that died',note:'Cause or signs (optional)'},
  weight:{label:'Weight check',f:['kg','note'],kg:'Average weight per animal (kg)',note:'Note (optional)'},
  sale:{label:'Sale of animals',f:['qty','amount','note'],qty:'Number sold',amount:'Total received (₦)',note:'Buyer (optional)'},

  expense:{label:'Other cost',f:['cat','amount','note'],cats:EXP_CATS,amount:'Amount (₦)',note:'Note (optional)'},
  income:{label:'Other income',f:['cat','amount','note'],cats:INC_CATS,amount:'Amount (₦)',note:'Note (optional)'},
  addstock:{label:'Animals added',f:['qty','amount'],qty:'Number added',amount:'Total cost (₦)'},
  birth:{label:'Births',f:['qty'],qty:'Number born'}
};
var BASE_TYPES=['feed','health','mortality','weight','sale','expense','income','addstock'];
var typesFor=function(sp){var e=(SP[sp]&&SP[sp].extra)||[];return e.concat(BASE_TYPES)};

var PL={
  broiler:{n:500,buy:1600,feedKg:4.4,feedPrice:1050,other:600,mort:5,rev:9000,weeks:8,rest:2,note:'Money from each bird is the live-weight sale price, about 2.3 kg at 8 weeks.'},
  layer:{n:300,buy:6500,feedKg:48,feedPrice:850,other:3500,mort:6,rev:62700,weeks:60,rest:4,note:'Money from each hen is about 11 crates of eggs plus the cull hen at the end of the laying cycle.'},
  catfish:{n:2000,buy:70,feedKg:1.4,feedPrice:1550,other:250,mort:15,rev:3500,weeks:24,rest:3,note:'Money from each fish is a 1 kg table-size fish.'},
  goat:{n:20,buy:38000,feedKg:54,feedPrice:450,other:6000,mort:5,rev:95000,weeks:26,rest:2,note:'Feed is concentrate only. Add your own cost for forage in other costs.'},
  pig:{n:10,buy:45000,feedKg:230,feedPrice:600,other:9000,mort:4,rev:218500,weeks:22,rest:2,note:'Money from each pig is about 95 kg live weight.'},
  cattle:{n:10,buy:450000,feedKg:400,feedPrice:300,other:25000,mort:2,rev:750000,weeks:26,rest:2,note:'Fattening lean animals bought at the start of the dry season.'}
};
var TIPS={
  broiler:['Start a new batch every one to two weeks so there are always birds to sell and money coming in.','Plan batches to be ready before Christmas, Easter and Sallah, when demand is strongest.','Feed is your biggest cost. Buy in bulk from one trusted supplier and weigh a sample each week to catch slow growth early.'],
  layer:['Sell by the crate directly to shops, hotels and bakeries instead of through middlemen.','Record eggs every day. A drop in the daily count is often the first sign of disease or poor feed.','Plan to restock before the old flock leaves, and sell cull hens when the laying cycle ends.'],
  catfish:['Sort fish by size every month. Mixed sizes lead to cannibalism and uneven harvests.','Sell fresh or smoked. Smoked fish keeps longer and often earns more per kilo.','Harvest in batches rather than all at once so you can sell at the best price.'],

};
var TABS=[['overview','Overview'],['animals','Animals'],['records','Records'],['money','Money'],['planner','Planner']];

    {id:'ggoa',name:'West African Dwarf goats',species:'goat',startDate:daysAgo(100),ageAtArrival:150,count:20,unitCost:38000,status:'active',done:{'ppr#0':daysAgo(93),'dew#0':daysAgo(70)}}

var gById=function(id){return state.groups.find(function(g){return g.id===id})};
function catOf(r){
  switch(r.type){
    case 'feed':return {kind:'out',cat:'Feed'};
    case 'health':return {kind:'out',cat:'Health & vet'};
    case 'addstock':return {kind:'out',cat:'Animals'};
    case 'expense':return {kind:'out',cat:r.cat||'Other costs'};
    case 'sale':return {kind:'in',cat:'Animal sales'};
    case 'eggsale':return {kind:'in',cat:'Egg sales'};
    case 'income':return {kind:'in',cat:r.cat||'Other income'};
  }
  return null;
}
function moneyEvents(){
  var ev=[];
  state.groups.forEach(function(g){var a=g.count*g.unitCost;if(a>0)ev.push({date:g.startDate,kind:'out',cat:'Animals',amount:a,gid:g.id})});
  state.records.forEach(function(r){var a=+r.amount||0;if(!a)return;var c=catOf(r);if(c)ev.push({date:r.date,kind:c.kind,cat:c.cat,amount:a,gid:r.gid})});
  return ev;
}
function stats(g){
  var st={added:0,births:0,dead:0,sold:0,feedKg:0,eggs7:0,income:0,cost:g.count*g.unitCost,weight:null,weightDate:''};
  var lim=daysAgo(7);
  state.records.forEach(function(r){
    if(r.gid!==g.id)return;
    var q=+r.qty||0,a=+r.amount||0;
    switch(r.type){
      case 'addstock':st.added+=q;break;
      case 'birth':st.births+=q;break;
      case 'mortality':st.dead+=q;break;
      case 'sale':st.sold+=q;break;
      case 'feed':st.feedKg+=(+r.kg||0);break;
      case 'eggs':if(r.date>lim)st.eggs7+=q;break;
      case 'weight':if(!st.weightDate||r.date>=st.weightDate){st.weight=+r.kg||0;st.weightDate=r.date}break;
    }
    var c=catOf(r);
    if(c&&a){if(c.kind==='in')st.income+=a;else st.cost+=a}
  });
  st.count=g.count+st.added+st.births-st.dead-st.sold;
  st.age=Math.max(0,daysBetween(g.startDate,today()))+(+g.ageAtArrival||0);
  var base=g.count+st.added;
  st.mortPct=base>0?st.dead/base*100:0;
  st.net=st.income-st.cost;
  st.henDay=(g.species==='layer'&&st.eggs7>0&&st.count>0)?st.eggs7/(7*st.count)*100:null;
  return st;
}
function nextDue(g,it){
  var age=+g.ageAtArrival||0,done=g.done||{};
  for(var n=0;n<40;n++){
    var off;
    if(it.every){
      if(it.catch&&age>it.d){off=7+n*it.every}
      else{var b=it.d+n*it.every;if(b<age)continue;off=b-age}
    }else{
      if(n>0)return null;
      if(it.d>=age)off=it.d-age;else if(it.catch)off=7;else return null;
    }
    var key=it.k+'#'+n;
    if(done[key])continue;
    return {key:key,date:addDays(g.startDate,off),title:it.t};
  }
  return null;
}
var dueText=function(d){return d<0?'overdue by '+(-d)+' day'+(d===-1?'':'s'):d===0?'due today':'due in '+d+' day'+(d===1?'':'s')};

/* ---------- saving ---------- */
var LKEY='agbo-farm-v1',backend='local',dbDoc=null,saveTimer=null,saving=false,dirty=false,lastJson='';
function setStatus(t){ui.status=t;var el=$('#status');if(el)el.textContent=t}
function save(){dirty=true;clearTimeout(saveTimer);setStatus('Saving…');saveTimer=setTimeout(flush,500)}
function flush(){
  if(saving||!dirty)return;
  saving=true;dirty=false;
  var json=JSON.stringify(state);lastJson=json;
  var p;
  if(backend==='db'&&dbDoc){p=dbDoc.set({json:json,v:1}).then(function(){setStatus('Saved')})}
  else{p=new Promise(function(res,rej){try{localStorage.setItem(LKEY,json);res()}catch(e){rej(e)}}).then(function(){setStatus('Saved on this device only')})}
  p.catch(function(e){setStatus(e&&e.code==='invalid_argument'?'View only: changes are not saved':'Could not save')}).then(function(){saving=false;if(dirty)flush()});
}
function adopt(json){
  try{var s=JSON.parse(json);if(s&&Array.isArray(s.groups)){s.records=Array.isArray(s.records)?s.records:[];s.name=s.name||'My farm';state=s;lastJson=json;return true}}catch(e){}
  return false;
}
function initBackend(){
  try{var raw=localStorage.getItem(LKEY);if(raw&&adopt(raw))render()}catch(e){}
  var useP=(window.claude&&window.claude.use)?window.claude.use('db'):Promise.resolve(null);
  useP.catch(function(){return null}).then(function(db){
    if(!db){backend='local';setStatus(lastJson?'Saved on this device only':'Not saved yet');return}
    backend='db';dbDoc=db.doc('farm/state');
    var got=false,t=setTimeout(function(){if(!got)setStatus('Saved data can’t be reached yet')},10000);
    dbDoc.onSnapshot(function(snap){
      if(!snap.metadata.fromCache){got=true;clearTimeout(t)}
      var d=snap.exists?snap.data():null;
      if(d&&d.json){
        if(d.json!==lastJson&&!dirty&&!saving&&adopt(d.json))render();
        if(!dirty&&!saving)setStatus('Saved');
      }else if(!snap.metadata.fromCache){
        if(lastJson){dirty=true;flush()}else setStatus('Not saved yet');
      }
    },function(){backend='local';setStatus('Saved on this device only')});
  });
}

  var max=niceMax(Math.max.apply(null,[1].concat(inc,exp)));
  var y=function(v){return T+ih-(v/max)*ih};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Money in and money out for each of the last six months">';
  [0,.5,1].forEach(function(f){var yy=y(max*f);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+nShort(max*f)+'</text>'});
  var gw=iw/keys.length,bw=Math.min(18,gw*.34);
  keys.forEach(function(k,i){
    var cx=L+gw*i+gw/2,hi=ih*(inc[i]/max),he=ih*(exp[i]/max);
    s+='<rect class="b-inc" x="'+(cx-bw-1)+'" y="'+(T+ih-hi)+'" width="'+bw+'" height="'+hi+'" rx="2"><title>'+monthName(k)+' money in '+naira(inc[i])+'</title></rect>';
    s+='<rect class="b-exp" x="'+(cx+1)+'" y="'+(T+ih-he)+'" width="'+bw+'" height="'+he+'" rx="2"><title>'+monthName(k)+' money out '+naira(exp[i])+'</title></rect>';
    s+='<text class="ax" x="'+cx+'" y="'+(H-7)+'" text-anchor="middle">'+monthName(k)+'</text>';
  });
  return s+'</svg>';
}
function vMoney(){
  if(!state.groups.length)return emptyFarm();
  var ev=moneyEvents(),tin=0,tout=0,cats={},keys=monthKeys(6),mi=keys.map(function(){return 0}),mo=keys.map(function(){return 0});
  ev.forEach(function(e){
    var i=keys.indexOf(e.date.slice(0,7));
    if(e.kind==='in'){tin+=e.amount;if(i>=0)mi[i]+=e.amount}
    else{tout+=e.amount;cats[e.cat]=(cats[e.cat]||0)+e.amount;if(i>=0)mo[i]+=e.amount}
  });
  var net=tin-tout;
  var cl=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}),cmax=cl.length?cats[cl[0]]:1;
  var bars=cl.length?'<div class="bars">'+cl.map(function(c){return '<div class="bar-row"><span>'+esc(c)+'</span><span><b>'+naira(cats[c])+'</b> <span class="muted">'+(cats[c]/tout*100).toFixed(0)+'%</span></span><span class="bar-track"><span class="bar-fill" style="width:'+(cats[c]/cmax*100)+'%"></span></span></div>'}).join('')+'</div>':'<p class="muted">No costs recorded yet.</p>';
  var rows=sortedGroups().map(function(g){var s=stats(g);return '<tr><td>'+esc(g.name)+'</td><td>'+naira(s.cost)+'</td><td>'+naira(s.income)+'</td><td class="'+(s.net<0?'neg':'pos')+'">'+naira(s.net)+'</td></tr>'}).join('');
  return '<div class="tiles"><div class="tile"><div class="k">Money in, all time</div><div class="v">'+naira(tin)+'</div></div><div class="tile"><div class="k">Money out, all time</div><div class="v">'+naira(tout)+'</div></div><div class="tile"><div class="k">Net, all time</div><div class="v '+(net<0?'neg':'pos')+'">'+naira(net)+'</div></div></div>'+
    '<section class="sec"><h2>Last six months</h2><ul class="legend"><li><i style="background:var(--inc)"></i>Money in</li><li><i style="background:var(--exp)"></i>Money out</li></ul><div class="panel pad">'+chartSVG(keys,mi,mo)+'</div></section>'+
    '<section class="sec"><h2>Where the money goes</h2><div class="panel pad">'+bars+'</div></section>'+
    '<section class="sec"><h2>Each group</h2><div class="panel pad tbl-wrap"><table><thead><tr><th>Group</th><th>Out</th><th>In</th><th>Net</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
    '<div class="actions" style="justify-content:flex-start"><button class="btn ghost sm" data-act="csv" id="csv-btn">Download records (CSV)</button></div>';
}
function csvText(){
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['Date','Group','Type','Quantity','Kg','Amount (NGN)','Category','Note']];
  state.groups.forEach(function(g){rows.push([g.startDate,g.name,'Starting stock',g.count,'',g.count*g.unitCost,'Animals',''])});
  state.records.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(r){
    var g=gById(r.gid),c=catOf(r);
    rows.push([r.date,g?g.name:'',RT[r.type]?RT[r.type].label:r.type,r.qty||'',r.kg||'',r.amount||'',c?c.cat:'',r.note||'']);
  });
  return rows.map(function(r){return r.map(q).join(',')}).join('\n');
}

/* ---------- planner ---------- */
function planInit(sp){var p=PL[sp];return {species:sp,n:p.n,buy:p.buy,feedKg:p.feedKg,feedPrice:p.feedPrice,other:p.other,mort:p.mort,rev:p.rev,weeks:p.weeks,rest:p.rest,setup:0}}
function calc(p){
  var surv=p.n*(1-p.mort/100),animals=p.n*p.buy,feed=p.n*p.feedKg*p.feedPrice,other=p.n*p.other,cost=animals+feed+other,revenue=surv*p.rev,profit=revenue-cost,cw=Math.max(1,p.weeks+p.rest),cycles=52/cw;
  return {surv:surv,animals:animals,feed:feed,other:other,cost:cost,revenue:revenue,profit:profit,cycles:cycles,annual:profit*cycles,roi:cost>0?profit/cost*100:0,even:surv>0?cost/surv:0};
}
var PF=[['n','Animals to start with','1','1'],['buy','Cost to buy each (₦)','any','0'],['feedKg','Feed each will eat in one cycle (kg)','any','0'],['feedPrice','Feed price (₦ per kg)','any','0'],
  ['other','Other costs for each (₦)','any','0'],['mort','Expected deaths (%)','any','0'],['rev','Money from each survivor (₦)','any','0'],['weeks','Weeks in one cycle','any','1'],['rest','Weeks of rest between cycles','any','0'],['setup','One-time setup cost, optional (₦)','any','0']];
function vPlanner(){
  if(!ui.plan)ui.plan=planInit('broiler');
  var p=ui.plan,sp=p.species;
  return '<section class="sec"><h2>Plan your next group</h2><p class="muted">Pick what you want to raise and see the profit before you spend. The starting figures are examples, not market quotes. Replace them with prices from your own area.</p>'+
    '<div class="chips" role="group" aria-label="Species">'+Object.keys(PL).map(function(k){return '<button class="chip" data-act="plansp" data-sp="'+k+'" aria-pressed="'+(k===sp)+'">'+SP[k].label+'</button>'}).join('')+'</div>'+
    '<div class="panel pad"><div class="plan-grid">'+PF.map(function(f){return '<label class="f">'+f[1]+'<input type="number" inputmode="decimal" min="'+f[3]+'" step="'+f[2]+'" data-plan="'+f[0]+'" value="'+p[f[0]]+'"></label>'}).join('')+'</div><p class="hint" style="margin-top:10px">'+esc(PL[sp].note)+'</p></div></section>'+
    '<div id="plan-out" class="sec"></div>'+
    '<section class="sec"><h2>Ways to grow</h2><div class="panel pad"><ul class="tips">'+TIPS[sp].map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></div></section>';
}
function renderPlanOut(){
  var el=$('#plan-out');if(!el||!ui.plan)return;
  var p=ui.plan,r=calc(p),feedShare=r.cost>0?r.feed/r.cost*100:0;
  var parts=[['Animals',r.animals,'seg-a'],['Feed',r.feed,'seg-b'],['Other costs',r.other,'seg-c']];
  var rows=[-10,0,10,20],cols=[-20,-10,0,10];
  var heat='<table class="heat"><thead><tr><th>Feed price</th>'+cols.map(function(c){return '<th>Sell '+(c>0?'+':c<0?'−':'')+Math.abs(c)+'%</th>'}).join('')+'</tr></thead><tbody>'+
    rows.map(function(rw){return '<tr><td>'+(rw===0?'As entered':(rw>0?'+':'−')+Math.abs(rw)+'%')+'</td>'+cols.map(function(c){var v=calc(Object.assign({},p,{feedPrice:p.feedPrice*(1+rw/100),rev:p.rev*(1+c/100)})).profit;return '<td class="'+(v>=0?'p':'n')+'">'+nShort(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>';
  var payback='';
  if(p.setup>0)payback=kv('Setup paid back in',r.annual>0?Math.round(p.setup/r.annual*12)+' months':'Not at these figures');
  el.innerHTML='<div class="result"><div class="k">Profit per cycle</div><div class="big '+(r.profit<0?'neg':'pos')+'">'+naira(r.profit)+'</div><div class="s">About '+naira(r.annual)+' a year at '+r.cycles.toFixed(1)+' cycles a year</div></div>'+
    '<div class="panel pad"><div class="kv">'+kv('Money in',naira(r.revenue))+kv('Money out',naira(r.cost))+kv('Break-even price each',naira(r.even))+kv('Return on money out',r.roi.toFixed(0)+'%')+payback+'</div></div>'+
    '<section class="sec"><h2>Where the money goes</h2><div class="panel pad" style="display:flex;flex-direction:column;gap:10px"><div class="stack">'+parts.map(function(x){return '<span class="'+x[2]+'" style="width:'+(r.cost>0?x[1]/r.cost*100:0)+'%"></span>'}).join('')+'</div>'+
    '<ul class="legend">'+parts.map(function(x){return '<li><i class="'+x[2]+'"></i>'+x[0]+' '+naira(x[1])+'</li>'}).join('')+'</ul><p class="muted">Feed is '+feedShare.toFixed(0)+'% of what you spend.</p></div></section>'+
    '<section class="sec"><h2>If prices move</h2><p class="muted">Profit per cycle when feed costs more or your selling price drops.</p><div class="panel pad tbl-wrap">'+heat+'</div></section>';
}

/* ---------- modals ---------- */
function openModal(inner){
  $('#modal').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">'+inner+'</div></div>';
  var f=$('#modal input,#modal select');if(f)f.focus();
}
function closeModal(){$('#modal').innerHTML=''}
function speciesOptions(sel){return Object.keys(SP).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+SP[k].label+'</option>'}).join('')}
function groupModal(){
  openModal('<h2 id="mt">Add a group</h2><form class="form" data-form="group">'+
    '<label class="f">Name<input id="g-name" type="text" required placeholder="e.g. Broilers, batch 4"></label>'+
    '<label class="f">What are they<select id="g-sp">'+speciesOptions('broiler')+'</select></label>'+
    '<div class="two"><label class="f">How many<input id="g-n" type="number" min="1" step="1" inputmode="numeric" required></label>'+
    '<label class="f">Cost for each (₦)<input id="g-c" type="number" min="0" step="any" inputmode="decimal" value="0"></label></div>'+
    '<div class="two"><label class="f">Arrived on<input id="g-d" type="date" value="'+today()+'" required></label>'+
    '<label class="f">Age on arrival (days)<input id="g-a" type="number" min="0" step="1" inputmode="numeric" value="'+SP.broiler.age+'"></label></div>'+
    '<p class="hint">Day-old chicks are 1 day old. Age sets your vaccine dates.</p>'+
    '<p class="err" id="ferr" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">Add group</button></div></form>');
}
function fieldHtml(type,sp){
  var d=RT[type],h='';
  d.f.forEach(function(k){
    if(k==='qty')h+='<label class="f">'+d.qty+'<input id="r-qty" type="number" min="1" step="1" inputmode="numeric"></label>';
    else if(k==='kg')h+='<label class="f">'+d.kg+'<input id="r-kg" type="number" min="0" step="any" inputmode="decimal"></label>';
    else if(k==='amount')h+='<label class="f">'+d.amount+'<input id="r-amt" type="number" min="0" step="any" inputmode="decimal"></label>';
    else if(k==='note')h+='<label class="f">'+d.note+'<input id="r-note" type="text" maxlength="120"></label>';
    else if(k==='cat')h+='<label class="f">Category<select id="r-cat">'+d.cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select></label>';
  });
  return h;
}
function recordModal(gid){
  var act=state.groups.filter(function(g){return g.status==='active'});
  if(!act.length)return;
  var g=(gid&&gById(gid)&&gById(gid).status==='active')?gById(gid):act[0];
  var types=typesFor(g.species);
  openModal('<h2 id="mt">Add a record</h2><form class="form" data-form="record">'+
    '<label class="f">Group<select id="r-g">'+act.map(function(x){return '<option value="'+x.id+'"'+(x.id===g.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label>'+
    '<div class="two"><label class="f">Date<input id="r-d" type="date" value="'+today()+'" required></label>'+
    '<label class="f">What happened<select id="r-t">'+types.map(function(t){return '<option value="'+t+'">'+RT[t].label+'</option>'}).join('')+'</select></label></div>'+
    '<div class="form" id="r-fields">'+fieldHtml(types[0],g.species)+'</div>'+
    '<p class="err" id="ferr" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit">Save record</button></div></form>');
}
function settingsModal(){
  var w=ui.confirm==='wipe',s=ui.confirm==='sample';
  openModal('<h2 id="mt">Settings</h2><form class="form" data-form="name"><label class="f">Farm name<input id="s-name" type="text" maxlength="60" value="'+esc(state.name)+'"></label><div class="actions"><button class="btn" type="submit">Save name</button></div></form>'+
    '<div class="form"><h3>Your data</h3>'+
    '<button class="btn ghost" data-act="csv">Download records (CSV)</button>'+
    (s?'<div class="actions" style="justify-content:flex-start"><button class="btn danger" data-act="loadsample">Replace my data with the example farm</button><button class="btn ghost" data-act="cancelconfirm2">Cancel</button></div>':'<button class="btn ghost" data-act="asksample">Show the example farm</button>')+
    (w?'<div class="actions" style="justify-content:flex-start"><button class="btn danger" data-act="wipe">Delete everything</button><button class="btn ghost" data-act="cancelconfirm2">Cancel</button></div>':'<button class="btn ghost" data-act="askwipe">Delete everything and start empty</button>')+
    '</div><div class="actions"><button class="btn ghost" data-act="close">Close</button></div>');
}

/* ---------- actions ---------- */
function go(tab){ui.tab=tab;if(location.hash!=='#'+tab)location.hash=tab;render();window.scrollTo(0,0)}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
function setErr(m){var e=$('#ferr');if(e)e.textContent=m}
function doCsv(){
  var p=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);
  p.then(function(dl){
    if(!dl){setStatus('Downloads are not available here');return}
    return dl.save({filename:'agbo-farm-records.csv',data:csvText()}).then(function(){setStatus('CSV saved')},function(e){if(!e||e.code!=='declined')setStatus('Could not save the file')});
  }).catch(function(){setStatus('Could not save the file')});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='scrim'){if(e.target===t)closeModal();return}
  switch(a){
    case 'tab':ui.openGroup=ui.tab==='animals'&&t.dataset.tab==='animals'?null:ui.openGroup;go(t.dataset.tab);break;
    case 'close':closeModal();break;
    case 'addgroup':groupModal();break;
    case 'addrec':recordModal(t.dataset.gid);break;
    case 'settings':ui.confirm=null;settingsModal();break;
    case 'opengroup':ui.openGroup=t.dataset.id;go('animals');break;
    case 'backgroups':ui.openGroup=null;render();window.scrollTo(0,0);break;
    case 'markdone':var g=gById(t.dataset.gid);if(g){g.done=g.done||{};g.done[t.dataset.key]=today();save();render()}break;
    case 'togglegroup':var g2=gById(t.dataset.id);if(g2){g2.status=g2.status==='active'?'closed':'active';save();render()}break;
    case 'askdelgroup':ui.confirm='g'+t.dataset.id;render();break;
    case 'delgroup':state.groups=state.groups.filter(function(x){return x.id!==t.dataset.id});state.records=state.records.filter(function(r){return r.gid!==t.dataset.id});ui.openGroup=null;ui.confirm=null;save();render();window.scrollTo(0,0);break;
    case 'askdelrec':ui.confirm='r'+t.dataset.id;render();break;
    case 'delrec':state.records=state.records.filter(function(r){return r.id!==t.dataset.id});ui.confirm=null;save();render();break;
    case 'cancelconfirm':ui.confirm=null;render();break;
    case 'startfresh':state={name:'My farm',sample:false,groups:[],records:[]};ui.openGroup=null;save();go('overview');break;
    case 'plansp':ui.plan=planInit(t.dataset.sp);render();break;
    case 'csv':doCsv();break;
    case 'asksample':ui.confirm='sample';settingsModal();break;
    case 'askwipe':ui.confirm='wipe';settingsModal();break;
    case 'cancelconfirm2':ui.confirm=null;settingsModal();break;
    case 'loadsample':state=sampleState();ui.openGroup=null;ui.confirm=null;save();closeModal();go('overview');break;
    case 'wipe':state={name:'My farm',sample:false,groups:[],records:[]};ui.openGroup=null;ui.confirm=null;save();closeModal();go('overview');break;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,kind=f.dataset.form;
  if(kind==='group'){
    var name=val('g-name'),n=parseInt(val('g-n'),10),c=parseFloat(val('g-c'))||0,d=val('g-d'),age=parseInt(val('g-a'),10)||0;
    if(!name)return setErr('Give the group a name.');
    if(!(n>0))return setErr('Enter how many animals there are.');
    if(!d)return setErr('Pick the date they arrived.');
    var g={id:rid('g'),name:name,species:val('g-sp'),startDate:d,ageAtArrival:Math.max(0,age),count:n,unitCost:Math.max(0,c),status:'active',done:{}};
    state.groups.push(g);ui.openGroup=g.id;save();closeModal();go('animals');
  }else if(kind==='record'){
    var gid=val('r-g'),type=val('r-t'),date=val('r-d'),gr=gById(gid);
    if(!gr||!RT[type]||!date)return setErr('Choose a group, a date and what happened.');
    var r={id:rid('r'),gid:gid,date:date,type:type},d2=RT[type];
    if(d2.f.indexOf('qty')>=0){r.qty=parseFloat(val('r-qty'));if(!(r.qty>0))return setErr('Enter a number greater than zero.')}
    if(d2.f.indexOf('kg')>=0){r.kg=parseFloat(val('r-kg'));if(!(r.kg>0))return setErr('Enter a weight greater than zero.')}
    if(d2.f.indexOf('amount')>=0){r.amount=parseFloat(val('r-amt'))||0}
    if(d2.f.indexOf('note')>=0)r.note=val('r-note');
    if(d2.f.indexOf('cat')>=0)r.cat=val('r-cat');
    if((type==='expense'||type==='income')&&!(r.amount>0))return setErr('Enter the amount.');
    if(type==='health'&&!r.note&&!(r.amount>0))return setErr('Say what was given or enter the cost.');
    if(type==='mortality'||type==='sale'){var have=stats(gr).count;if(r.qty>have)return setErr('This group only has '+num(have)+' on record.')}
    state.records.push(r);save();closeModal();render();
  }else if(kind==='name'){
    state.name=val('s-name')||'My farm';save();closeModal();render();
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='flt-g'){ui.fg=e.target.value;render()}
  else if(id==='flt-t'){ui.ft=e.target.value;render()}
  else if(id==='g-sp'){var a=$('#g-a');if(a)a.value=SP[e.target.value].age}
  else if(id==='r-g'||id==='r-t'){
    var g=gById(val('r-g'));if(!g)return;
    var types=typesFor(g.species),cur=val('r-t');
    if(id==='r-g'){var sel=$('#r-t');sel.innerHTML=types.map(function(t){return '<option value="'+t+'">'+RT[t].label+'</option>'}).join('');if(types.indexOf(cur)>=0)sel.value=cur}
    $('#r-fields').innerHTML=fieldHtml(val('r-t'),g.species);
  }
});
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.plan;
  if(k&&ui.plan){var v=parseFloat(e.target.value);ui.plan[k]=isFinite(v)?v:0;renderPlanOut()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal').firstChild)closeModal()});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h})&&h!==ui.tab){ui.tab=h;render()}});

var h0=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h0}))ui.tab=h0;
render();
initBackend();
})();
</script>
